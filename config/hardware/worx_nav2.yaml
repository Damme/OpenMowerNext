# Nav2 overrides for the Worx robot, layered on config/nav2_params.yaml
# (OM_NAV2_PARAMS_OVERLAY). Speeds follow the ROS1 FTC planner that mows with
# this robot today: speed_fast 0.3 m/s, speed_slow 0.12 m/s, 45 deg/s turns,
# goal tolerance 0.15 m / 20 deg.
bt_navigator:
  ros__parameters:
    # Names the goal/progress checkers explicitly (needed with the FTC ones loaded).
    default_nav_to_pose_bt_xml: "$(find-pkg-share open_mower_next)/config/behavior_trees/navigate_to_pose.xml"

controller_server:
  ros__parameters:
    # Real robot 2026-09-28: the default "odom" has no publisher, so the
    # controllers saw speed 0 and RPP's rotate-to-heading, limited to
    # current speed + max_angular_accel * dt, crawled at 0.075 rad/s.
    odom_topic: /odometry/filtered
    # FollowPath (RPP) for transit, FTC for mowing passes (mower_logic controller_id).
    controller_plugins: ["FollowPath", "FTC"]
    goal_checker_plugins: ["general_goal_checker", "ftc_goal_checker", "transit_goal_checker"]
    progress_checker_plugins: ["progress_checker", "ftc_progress_checker"]
    # Transit to a pass start (behavior_trees/transit_to_pass.xml): position only.
    transit_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 3.15
    ftc_goal_checker:
      plugin: "open_mower_next::ftc_controller::FTCGoalChecker"
      controller: "FTC"
    # FTC may rotate in place up to goal_timeout without translating.
    ftc_progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 30.0
    # Tuning of the Worx robot's ROS1 ftc_local_planner.yaml.
    FTC:
      plugin: "open_mower_next::ftc_controller::FTCController"
      speed_fast: 0.3
      # m of straight path ahead for speed_fast. 2.0 slowed down ~3 m before every
      # turn (Daniel, real mow 2026-09-28); braking 0.3 -> 0.1 m/s takes ~0.4 m.
      speed_fast_threshold: 0.6
      speed_fast_threshold_angle: 20.0
      speed_slow: 0.10
      speed_angular: 45.0
      acceleration: 0.1
      lateral_priority_distance: 0.15
      # Beside the path (slid down a slope while turning): steer at an approach
      # angle atan(offset / rejoin_lookahead) <= rejoin_max_angle deg instead of
      # the PID, blended in between rejoin_blend_start and _full m (rejoin.hpp).
      rejoin: true
      rejoin_blend_start: 0.10
      rejoin_blend_full: 0.25
      rejoin_lookahead: 0.5
      rejoin_max_angle: 30.0
      kp_lon: 1.5          # ROS1 4.0 without feedforward: stop-and-go on the robot
      lon_feedforward: true
      ki_lon: 0.0
      ki_lon_max: 10.0
      kd_lon: 0.0
      kp_lat: 12.0   # ROS1 25: swung at the pass start on the robot (10-20 cm offset -> w saturated)
      ki_lat: 0.06153
      ki_lat_max: 62.0
      kd_lat: 1.23
      kp_ang: 3.0
      ki_ang: 0.0
      ki_ang_max: 62.0
      kd_ang: 0.5
      max_cmd_vel_speed: 1.0
      max_cmd_vel_ang: 2.8
      max_goal_distance_error: 0.15
      max_goal_angle_error: 20.0
      goal_timeout: 20.0
      max_follow_distance: 1.0
      forward_only: true
      check_obstacles: false
    general_goal_checker:
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.35
    FollowPath:
      desired_linear_vel: 0.3
      # Default 0.1 s: TF lags more on the Pi (control loop 12-20 Hz) -> TF_ERROR aborts.
      transform_tolerance: 0.5
      # 0.4 snaked on the robot (±20 deg heading, 2026-09-29: 0.65 s cmd->yaw lag at crawl speed);
      # 0.8 set live the same day, somewhat better. use_velocity_scaled_lookahead_dist is off.
      lookahead_dist: 0.8
      # No collision check: the local costmap holds only the map (the lines are
      # drivable - the mower recorded them), the planner keeps the path inside.
      # On the rim (outline passes run 4 cm inside the line) RPP's projected arc
      # clipped the outside cells and froze the robot: a grid artefact.
      use_collision_detection: false
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      lookahead_time: 1.0
      # 0.9 made every small correction a crawl at w = 0.3/0.9 = 0.33 rad/s (bang-bang).
      regulated_linear_scaling_min_radius: 0.3
      regulated_linear_scaling_min_speed: 0.12
      min_approach_linear_velocity: 0.05
      rotate_to_heading_angular_vel: 0.8
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.0   # = velocity_smoother max_decel (real robot)

velocity_smoother:
  ros__parameters:
    # Real robot 2026-09-28: 2.5 m/s^2 linear spun the wheels. Angular 0.8 rad/s /
    # 1.0 rad/s^2 made FTC (ROS1 gains, ROS1 had no smoother) swing +-60 deg in
    # S-curves; 1.5 rad/s / 3.0 rad/s^2 tracked. The undock wheel spin was the
    # docking controller swinging w: limited there (docking_server v_angular_max).
    max_velocity: [0.3, 0.0, 1.5]
    min_velocity: [-0.3, 0.0, -1.5]
    max_accel: [0.3, 0.0, 3.0]
    max_decel: [-0.5, 0.0, -3.0]

# Spin brakes with its own limit: keep it at the smoother's (else it overshoots).
behavior_server:
  ros__parameters:
    rotational_acc_lim: 3.0

# Body 0.58 x 0.39 m, base_link on the wheel axle 0.11 m from the rear.
local_costmap:
  local_costmap:
    ros__parameters:
      # Recorded boundaries are where the GPS antenna (~robot centre) drove; the
      # body overhung them by half the mower's width while recording, so that
      # rim is known to be clear. The centre must stay inside the line, the
      # footprint inside line + rim, nothing beyond (RimCostLayer, map_server
      # grid.edge_band). Same for exclusions, recorded by driving around them.
      # Body 0.58 x 0.39 m, base_link on the wheel axle 0.11 m from the rear.
      footprint: "[[0.47, 0.095], [0.37, 0.195], [-0.11, 0.195], [-0.11, -0.195], [0.37, -0.195], [0.47, -0.095]]"
      # Map grid only (areas, exclusions, rim). The bump obstacles are fuzzy guesses
      # (the sensor doesn't say where it was hit) and live in the global costmap
      # for planning around them; here they blocked the back-up and RPP
      # ("collision ahead") between a guessed mark and the real obstacle.
      plugins: ["static_layer", "rim_layer", "inflation_layer"]
      track_unknown_space: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/map_grid"
        trinary_costmap: false  # keep the rim's cost (default maps < 100 to free)
      rim_layer:
        plugin: "open_mower_next::costmap_layers::RimCostLayer"
        from_cost: 152   # static layer: grid.edge_band_value 60 -> 60/100 * 254 (drawn mid-grey in rviz)
        to_cost: 253     # INSCRIBED: centre forbidden, footprint allowed
      # Wide, soft gradient around exclusions AND the area edges (unknown), so
      # transits keep a margin where there is room (tire marks; a GPS glitch
      # near the edge must not put the robot outside). ~120 at 0.5 m, ~60 at 0.8 m.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.2
        cost_scaling_factor: 2.5      # slower fall-off: corridor centres clearly cheaper than the edges
        inflate_around_unknown: true
global_costmap:
  global_costmap:
    ros__parameters:
      # Recorded boundaries are where the GPS antenna (~robot centre) drove; the
      # body overhung them by half the mower's width while recording, so that
      # rim is known to be clear. The centre must stay inside the line, the
      # footprint inside line + rim, nothing beyond (RimCostLayer, map_server
      # grid.edge_band). Same for exclusions, recorded by driving around them.
      # Body 0.58 x 0.39 m, base_link on the wheel axle 0.11 m from the rear.
      footprint: "[[0.47, 0.095], [0.37, 0.195], [-0.11, 0.195], [-0.11, -0.195], [0.37, -0.195], [0.47, -0.095]]"
      # Map grid (map_server: unknown outside the areas = blocked, exclusions
      # lethal, the rim), obstacles found by bumping (mower_logic
      # ~/bump_obstacles) and inflation so transits keep well inside.
      plugins: ["static_layer", "rim_layer", "bump_layer", "inflation_layer"]
      track_unknown_space: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/map_grid"
        trinary_costmap: false  # keep the rim's cost (default maps < 100 to free)
      rim_layer:
        plugin: "open_mower_next::costmap_layers::RimCostLayer"
        from_cost: 152   # static layer: grid.edge_band_value 60 -> 60/100 * 254 (drawn mid-grey in rviz)
        to_cost: 253     # INSCRIBED: centre forbidden, footprint allowed
      bump_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        footprint_clearing_enabled: false
        observation_sources: bumps
        bumps:
          topic: /mower_logic/bump_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: -1.0
          max_obstacle_height: 1.0
          obstacle_min_range: 0.0
          obstacle_max_range: 1000.0
      # Wide, soft gradient around exclusions AND the area edges (unknown), so
      # transits keep a margin where there is room (tire marks; a GPS glitch
      # near the edge must not put the robot outside). ~120 at 0.5 m, ~60 at 0.8 m.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.2
        cost_scaling_factor: 2.5      # slower fall-off: corridor centres clearly cheaper than the edges
        inflate_around_unknown: true

# Transit planner: state lattice with diff-drive primitives (in-place turns),
# checking the footprint (centre vs 253, footprint vs lethal/unknown - see the
# costmaps). Lattice resolution = map grid 5 cm.
planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: "$(find-pkg-share nav2_smac_planner)/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_unknown: false
      tolerance: 0.25
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 3.0             # 5.0 made long transits exceed max_iterations
      rotation_penalty: 1.5         # default 5.0 preferred loops over turning in place
      retrospective_penalty: 0.015
      allow_reverse_expansion: false
      cache_obstacle_heuristic: true
      smooth_path: true
      # The smoother isn't cost-aware and pulls paths toward inner corners: keep
      # it gentle so the path keeps its distance from the edges.
      smoother:
        max_iterations: 1000
        w_smooth: 0.15
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

# Undocking reverses to the staging pose, and docking starts its approach there:
# 3 m out onto the lawn before the mission starts (the dock sits outside the areas).
docking_server:
  ros__parameters:
    openmower:
      staging_x_offset: -3.0
    controller:
      # "Lookup would require extrapolation into the future" aborted undocks
      # halfway (TF slightly behind the control loop on a loaded machine).
      transform_tolerance: 0.5
      # Real robot 2026-09-28: swung w +-0.75 at the staging pose after the undock
      # (wheel spin on the lawn).
      v_angular_max: 0.4
