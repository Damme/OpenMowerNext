# The Worx robot without python (om_launch): what launch/openmower.launch.py starts
# for OM_HARDWARE=worx, composed into four processes.
#
#   OM_MAP_PATH=... OM_DATUM_LAT=... OM_DATUM_LONG=... \
#     /ws/install/open_mower_next/lib/open_mower_next/om_launch \
#     /ws/install/open_mower_next/share/open_mower_next/config/launch/worx.yaml
#
# Options (environment): OM_WORX_MOTORS_ENABLED (true), OM_IMU_I2C_DEVICE (/dev/i2c-1),
# OM_GPS_ENABLED (true), OM_GPS_HOST/OM_GPS_PORT (str2str's UBX server, 127.0.0.1:5015), OM_GPS_FIX_TOPIC,
# OM_GPS_WAIT_TIME_SEC, OM_GPS_RECENT_TIMEOUT_SEC, OM_BATTERY_LOW_FRACTION,
# OM_BATTERY_RESUME_FRACTION, OM_MOWING_AREAS, OM_DISABLED_AREAS_PATH, OM_EDGE_CORRECTIONS_PATH,
# OM_MISSION_PATH, OM_AUTO_RESUME (false: after charging / rain it stays docked until start_mowing).
env:
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  # glibc: one malloc arena per thread, and big blocks kept in the heap after free,
  # held ~150 MB of freed memory in the whole stack (Nav2: Smac's search graph and
  # heuristic, costmap messages). Two arenas; blocks >= 512 KiB come from their own
  # mapping and go back to the system when freed.
  MALLOC_ARENA_MAX: "2"
  MALLOC_MMAP_THRESHOLD_: "524288"
  OM_HARDWARE: worx

processes:
  # ros2_control with the Worx board over SPI + the robot model.
  - name: control
    components:
      - plugin: robot_state_publisher::RobotStatePublisher
        name: robot_state_publisher
        params:
          - robot_description@file: $(find-pkg-share open_mower_next)/generated/worx_spidev.urdf
      # Controllers get the controller manager's arguments (not process-wide ones).
      - plugin: controller_manager
        name: controller_manager
        remap: {"~/robot_description": /robot_description}
        # 50 Hz: the board reports every 50 ms; 100 Hz overran on the Pi Zero 2.
        params: [$(find-pkg-share open_mower_next)/generated/worx_controllers.yaml, {update_rate: 50}]
        activate: [joint_state_broadcaster, diff_drive_base_controller, mower_controller]

  # Nav2. Its costmaps are child nodes: they only see process-wide parameter files.
  - name: nav
    ros_args:
      - --params-file
      - $(find-pkg-share open_mower_next)/config/nav2_params.yaml
      - --params-file
      - $(find-pkg-share open_mower_next)/config/hardware/worx_nav2.yaml
      - --params-file
      - $(find-pkg-share open_mower_next)/config/hardware/worx_nav2_robot.yaml
      - -p
      - use_sim_time:=false
    components:
      - plugin: nav2_controller::ControllerServer
        name: controller_server
        remap: {cmd_vel: cmd_vel_raw}
      - plugin: nav2_bt_navigator::BtNavigator
        name: bt_navigator
      - plugin: behavior_server::BehaviorServer
        name: behavior_server
        remap: {cmd_vel: cmd_vel_raw}
      - plugin: nav2_planner::PlannerServer
        name: planner_server
      - plugin: nav2_velocity_smoother::VelocitySmoother
        name: velocity_smoother
        remap: {cmd_vel: cmd_vel_raw, cmd_vel_smoothed: cmd_vel_nav}
      - plugin: opennav_docking::DockingServer
        name: docking_server
        remap: {cmd_vel: cmd_vel_raw}
      - plugin: nav2_lifecycle_manager::LifecycleManager
        name: lifecycle_manager_navigation
        params:
          - autostart: true
            node_names: [controller_server, planner_server, behavior_server, bt_navigator, velocity_smoother,
                         docking_server]

  # Sensors, localization, map, coverage planning, docking helper and the mission.
  - name: core
    ros_args:
      - --params-file
      - $(find-pkg-share open_mower_next)/config/robot_localization.yaml
      - -p
      - use_sim_time:=false
    components:
      - plugin: open_mower_next::lsm6dsv_imu::Lsm6dsvImuNode
        name: lsm6dsv_imu
        params:
          - i2c_device: $(env OM_IMU_I2C_DEVICE /dev/i2c-1)
      - plugin: open_mower_next::localization_components::Ekf
        name: ekf_se_odom
        # 25 Hz (robot_localization.yaml: 50): 50 Hz missed its rate on the Pi Zero 2.
        # IMU: yaw rate only. Its linear acceleration (12 deg mount tilt, auto-levelled)
        # integrated into ~0.1 m/s position drift while standing still without GPS.
        # Wheels: velocity only, no yaw rate. On grass the wheels slip unevenly (undock
        # 2026-09-28: wheels -37 deg, gyro +1.4 deg) and pulled the heading off the gyro.
        params:
          - frequency: 25.0
            sensor_timeout: 0.1
            imu0_config: [false, false, false, false, false, false, false, false, false,
                          false, false, true, false, false, false]
            odom0_config: [false, false, false, false, false, false, true, true, true,
                           false, false, false, false, false, false]
        # Both EKFs would listen on the same set_pose: one topic each.
        remap: {imu/data: imu/data_raw, set_pose: /ekf_se_odom/set_pose}
      - plugin: open_mower_next::localization_components::Ekf
        name: ekf_se_map
        params:
          - frequency: 25.0
            sensor_timeout: 0.1
            imu0_config: [false, false, false, false, false, false, false, false, false,
                          false, false, true, false, false, false]
            odom0_config: [false, false, false, false, false, false, true, true, true,
                           false, false, false, false, false, false]
        remap: {imu/data: imu/data_raw, odometry/filtered: odometry/filtered/map, set_pose: /ekf_se_map/set_pose}
      # Learns the wheel scale (ticks -> metres) from RTK on straight drives and
      # hands it to worx_hardware; kept in /data/wheel_scale.txt.
      - plugin: open_mower_next::wheel_scale::WheelScaleNode
        name: wheel_scale
        params:
          - enabled: $(env OM_WHEEL_SCALE_LEARN true)
      - plugin: robot_localization::NavSatTransform
        name: navsat_transform_node
        # GPS through docking_helper's gate: nothing on the charger, only RTK fixed.
        remap: {odometry/filtered: odometry/filtered/map, imu: gps/orientation, gps/fix: /gps/fix_filtered}
        params:
          - datum: [$(env OM_DATUM_LAT), $(env OM_DATUM_LONG), 0.0]
      - plugin: open_mower_next::map_server::MapServerNode
        name: map_server
        remap: {map_grid: map_grid, map: mowing_map}
        params:
          - path: $(env OM_MAP_PATH)
            datum: [$(env OM_DATUM_LAT), $(env OM_DATUM_LONG)]
            grid.use_gaussian_blur: false
            grid.resolution: $(env OM_MAP_GRID_RESOLUTION 0.05)
            grid.edge_band: 0.25
            grid.exclusion_band: 0.25
            grid.edge_band_value: 60
            grid.stance_front: 0.47
            grid.stance_rear: 0.11
            grid.stance_half_width: 0.195
            grid.stance_front_chamfer: 0.10
      - plugin: open_mower_next::map_recorder::MapRecorderNode
        name: map_recorder
      - plugin: open_mower_next::docking_helper::DockingHelperNode
        name: docking_helper
        params:
          - set_pose_when_docked: true   # on the charger: heading and position from the recorded dock
            gps_gate: true               # /gps/fix -> /gps/fix_filtered (navsat) off the charger, RTK fixed only
      - plugin: open_mower_next::coverage_server::CoverageServerNode
        name: coverage_server
      - plugin: open_mower_next::mower_logic::MowerLogicNode
        name: mower_logic
        executor: multi
        threads: 2
        params:
          - gps_fix_topic: $(env OM_GPS_FIX_TOPIC /gps/fix)
            gps_settle: $(env OM_GPS_WAIT_TIME_SEC 10.0)
            gps_timeout: $(env OM_GPS_RECENT_TIMEOUT_SEC 4.0)   # Daniel: ~4 s on IMU + ticks without RTK fixed
            battery_low: $(env OM_BATTERY_LOW_FRACTION 0.2)
            battery_resume: $(env OM_BATTERY_RESUME_FRACTION 0.95)
            dock_on_rain: $(env OM_DOCK_ON_RAIN true)
            areas: $(env OM_MOWING_AREAS "")
            disabled_areas_file: $(env OM_DISABLED_AREAS_PATH /data/disabled_areas.txt)
            mission_file: $(env OM_MISSION_PATH /data/mission.txt)
            auto_resume: $(env OM_AUTO_RESUME false)
            edge_corrections_file: $(env OM_EDGE_CORRECTIONS_PATH /data/edge_corrections.txt)
            controller_id: FTC
            goal_checker_id: ftc_goal_checker
            progress_checker_id: ftc_progress_checker

  - name: twist_mux
    cmd: [/opt/ros/jazzy/lib/twist_mux/twist_mux, --ros-args,
          --params-file, $(find-pkg-share open_mower_next)/config/twist_mux.yaml,
          -r, /cmd_vel_out:=/diff_drive_base_controller/cmd_vel]

  # u-blox F9P: str2str owns the serial port (and feeds it NTRIP corrections)
  # and serves the receiver's UBX on TCP; ubx_gps reads NAV-PVT from there.
  - name: gps
    enabled: $(env OM_GPS_ENABLED true)
    components:
      - plugin: open_mower_next::ubx_gps::UbxGpsNode
        name: ubx_gps
        params:
          - host: $(env OM_GPS_HOST 127.0.0.1)
            port: $(env OM_GPS_PORT 5015)

  # Test recording (OM_RECORD=true) into an MCAP bag at OM_RECORD_URI (a
  # directory that must not exist yet). Only what drive/dock tests need: all
  # topics took ~50 % of a Pi Zero 2 core. /rosout holds every node's log.
  - name: record
    enabled: $(env OM_RECORD false)
    components:
      - plugin: rosbag2_transport::Recorder
        name: recorder
        params:
          - storage.uri: $(env OM_RECORD_URI)
            storage.storage_id: mcap
            storage.max_cache_size: 2000000
            record.all_topics: false
            record.include_hidden_topics: true   # action feedback/status (docking progress)
            record.regex: "/tf|/tf_static|/joint_states|/rosout|/imu/data_raw|/gps/fix|/gps/fix_filtered|/odometry/gps|/odometry/filtered.*|/diff_drive_base_controller/(cmd_vel|odom)|/cmd_vel_.*|/worx/status|/power.*|/mower_logic/state|/plan|/received_global_plan|/FTC/.*|/docking_trajectory|/staging_pose|/dock_pose|.*/_action/(feedback|status)"
